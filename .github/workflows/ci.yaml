name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_CONTENT_MODE: public

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security mitigations
        run: npm run test:security

      - name: Typecheck
        run: npm run typecheck

      - name: Verify versioned design and content contracts
        run: |
          npm run lint:design
          npm run content:check
          npm run lint:content
          npm run test:design

      - name: Verify UI compatibility boundaries
        run: npm run test:ui

      - name: Verify public content and About isolation
        run: npm run test:content

      - name: Build all locales for GitHub Pages
        run: npm run build
        env:
          SITE_URL: https://jyje.github.io
          SITE_BASE_URL: /profile-2/

      - name: Install browser for public navigation checks
        run: npx playwright install --with-deps chromium

      - name: Verify static routes and publication boundaries
        run: npm run test:publication

      - name: Verify browser navigation and public About boundaries
        run: node scripts/verify-built-site.mjs

      - name: Verify wiki graphs and publication behavior
        run: npm run test:wiki

      - name: Verify bilingual breadcrumbs
        run: npm run test:breadcrumbs

      - name: UX-001 screenshot and coordinate lint
        id: ux_lint
        run: npm run lint:ux

      - name: Upload UX lint captures and report
        if: ${{ always() && (steps.ux_lint.outcome == 'success' || steps.ux_lint.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: ux-lint-captures
          path: .playwright-mcp/ux-lint/after/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify homepage intro, curation and navigation
        run: npm run test:homepage
