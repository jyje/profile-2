name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_CONTENT_MODE: public

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency security mitigations
        run: pnpm run test:security

      - name: Generate allowlisted dependency audit summary
        run: node scripts/audit-summary.mjs > audit-summary.json

      - name: Upload sanitized dependency summary
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-summary
          path: audit-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify versioned design and content contracts
        run: |
          pnpm run lint:design
          pnpm run content:check
          pnpm run lint:content
          pnpm run test:design

      - name: Verify UI compatibility boundaries
        run: pnpm run test:ui

      - name: Verify public content and About isolation
        run: pnpm run test:content

      - name: Verify container source and publication contracts
        run: pnpm run test:container

      - name: Build all locales for GitHub Pages
        run: pnpm run build
        env:
          SITE_URL: https://jyje.github.io
          SITE_BASE_URL: /profile-2/

      - name: Install browser for public navigation checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify static routes and publication boundaries
        run: pnpm run test:publication

      - name: Verify browser navigation and public About boundaries
        run: node scripts/verify-built-site.mjs

      - name: Verify wiki graphs and publication behavior
        run: pnpm run test:wiki

      - name: Verify bilingual breadcrumbs
        run: pnpm run test:breadcrumbs

      - name: UX-001 screenshot and coordinate lint
        id: ux_lint
        run: pnpm run lint:ux

      - name: Upload UX lint captures and report
        if: ${{ always() && (steps.ux_lint.outcome == 'success' || steps.ux_lint.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: ux-lint-captures
          path: .playwright-mcp/ux-lint/after/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Verify homepage intro, curation and navigation
        run: pnpm run test:homepage
