name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_CONTENT_MODE: public

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify UI compatibility boundaries
        run: npm run test:ui

      - name: Verify content network and career selections
        run: npm run test:content

      - name: Build all locales for GitHub Pages
        run: npm run build
        env:
          SITE_URL: https://jyje.github.io
          SITE_BASE_URL: /profile-2/

      - name: Install browser for career exports
        run: npx playwright install --with-deps chromium

      - name: Verify static routes and publication boundaries
        run: npm run test:publication

      - name: Verify browser navigation and bilingual PDFs
        run: node scripts/verify-built-site.mjs

      - name: Verify wiki graphs and publication behavior
        run: npm run test:wiki

      - name: Verify bilingual breadcrumbs
        run: npm run test:breadcrumbs

      - name: Verify homepage text resizing and navigation
        run: npm run test:homepage

      - name: Upload career document review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: career-documents
          path: output/pdf/
          if-no-files-found: warn
          retention-days: 7
