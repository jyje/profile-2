name: Publish development image
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-image
  cancel-in-progress: true
jobs:
  image:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      SITE_CONTENT_MODE: development
      SITE_URL: ${{ vars.DEV_SITE_URL }}
      LABS_REMOTE_ENTRY: ${{ vars.DEV_LABS_REMOTE_ENTRY }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/profile-2-dev:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Validate configuration
        run: node -e 'const u = new URL(process.env.SITE_URL); if (u.protocol !== "https:") process.exit(1)'
      - run: npm ci
      - name: Validate source contracts
        run: |
          npm run test:security
          npm run test:content
          npm run test:design
          npm run test:ui
          node --test scripts/test-container-context.mjs
      - name: Prepare clean source context
        id: context
        run: |
          node scripts/container-context.mjs > "$RUNNER_TEMP/container-context.json"
          node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/container-context.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "path=" + data.destination + "\n");'
      - name: Build native ARM64 image
        env:
          SOURCE_CONTEXT: ${{ steps.context.outputs.path }}
        run: |
          docker buildx build --load --platform linux/arm64 --tag "$IMAGE" \
            --build-arg SITE_URL="$SITE_URL" --build-arg SITE_CONTENT_MODE=development \
            --build-arg LABS_REMOTE_ENTRY="$LABS_REMOTE_ENTRY" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" "$SOURCE_CONTEXT"
          docker image inspect "$IMAGE" --format '{{.Id}}'
      - name: Start restricted container
        run: |
          docker run -d --name profile2-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 "$IMAGE"
          node -e '(async()=>{for(let i=0;i<30;i++){try{if((await fetch("http://127.0.0.1:8080/healthz")).ok)return;}catch{} await new Promise(r=>setTimeout(r,1000));}process.exit(1)})()'
      - name: Verify runtime boundary
        env:
          CONTAINER_ORIGIN: http://127.0.0.1:8080
          EXPECTED_REVISION: ${{ github.sha }}
          REQUIRE_CLEAN_REVISION: 'true'
        run: |
          node scripts/verify-container.mjs
          docker exec profile2-ci sh -c 'test ! -e /site && test ! -e /usr/share/nginx/html/.git && ! command -v node'
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify runtime UX
        id: ux
        env:
          VERIFY_ORIGIN: http://127.0.0.1:8080
          VERIFY_BASE_PATH: /
        run: npm run lint:ux
      - name: Retain runtime UX evidence
        if: ${{ always() && (steps.ux.outcome == 'success' || steps.ux.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: development-container-ux
          path: .playwright-mcp/ux-lint/after/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Login after validation
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish source tag and capture immutable digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push "$IMAGE"
          test "$(gh api /users/${{ github.repository_owner }}/packages/container/profile-2-dev --jq .visibility)" = private
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' > "$RUNNER_TEMP/image-digest.json"
          node -e 'const fs=require("fs"); const digest=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/image-digest.json")); if(!/^sha256:[a-f0-9]{64}$/.test(digest))process.exit(1); fs.writeFileSync("image-reference.json",JSON.stringify({image:process.env.IMAGE,revision:process.env.GITHUB_SHA,digest},null,2));'
      - uses: actions/upload-artifact@v7
        with:
          name: development-image-reference
          path: image-reference.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop owned validation container
        if: always()
        run: docker rm -f profile2-ci || true
