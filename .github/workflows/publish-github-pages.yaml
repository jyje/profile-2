name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_CONTENT_MODE: public

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security mitigations
        run: npm run test:security

      - name: Typecheck
        run: npm run typecheck

      - name: Verify versioned design and content contracts
        run: |
          npm run lint:design
          npm run content:check
          npm run test:design

      - name: Build all locales
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - name: Verify static routes and publication boundaries
        run: npm run test:publication

      - name: Install browser for UX lint
        run: npx playwright install --with-deps chromium

      - name: UX-001 screenshot and coordinate lint
        id: ux_lint
        run: npm run lint:ux
        env:
          VERIFY_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload UX lint captures and report
        if: ${{ always() && (steps.ux_lint.outcome == 'success' || steps.ux_lint.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: pages-ux-lint-captures
          path: .playwright-mcp/ux-lint/after/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          retention-days: 1

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
